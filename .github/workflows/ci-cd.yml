name: Smart Expense Tracker CI/CD

on:
  push:
    branches:
      - main
      

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI - Build React App
  # =========================
  build:
    name: Build React App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Smart_Expense_Tracker

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Smart_Expense_Tracker/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React application
      - name: Build React app
        run: npm run build


  # =========================
  # CD - Build & Push Docker
  # =========================
  docker:
    name: Build and Push Docker Image
    needs: build

    # Only run Docker deployment after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Check DockerHub username secret
      - name: Check DockerHub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "❌ DOCKERHUB_USERNAME is empty"
            exit 1
          else
            echo "✅ DOCKERHUB_USERNAME is available"
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "❌ DOCKERHUB_TOKEN is empty"
            exit 1
          else
            echo "✅ DOCKERHUB_TOKEN is available"
          fi

      # 3. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t yashdev04/smart-expense-tracker:latest ./Smart_Expense_Tracker

      # 5. Push Docker image
      - name: Push Docker image
        run: |
          docker push yashdev04/smart-expense-tracker:latest