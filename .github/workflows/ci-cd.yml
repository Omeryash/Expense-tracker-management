# netlify and docker both 

name: Smart Expense Tracker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================
  # CI - Test & Build React App
  # =========================
  build:
    name: Test and Build React App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Smart_Expense_Tracker

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Smart_Expense_Tracker/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run automated tests
      - name: Run tests
        run: npm test

      # 5. Build React application
      - name: Build React app
        run: npm run build


  # =========================
  # CD - DockerHub
  # =========================
  docker:
    name: Build and Push Docker Image
    needs: build

    # Only run Docker deployment after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker image
        run: docker build -t yashdev04/smart-expense-tracker:latest ./Smart_Expense_Tracker

      # 4. Push Docker image
      - name: Push Docker image
        run: docker push yashdev04/smart-expense-tracker:latest


  # =========================
  # CD - Netlify
  # =========================
  netlify:
    name: Deploy to Netlify
    needs: build

    # Only run Netlify deployment after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Smart_Expense_Tracker

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Smart_Expense_Tracker/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React application
      - name: Build React app
        run: npm run build

      # 5. Deploy to Netlify
      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=Smart_Expense_Tracker/dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}